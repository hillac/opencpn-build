name: Build and release OpenCPN Android arm64
on:
  workflow_dispatch:
    inputs:
      opencpn_tag:
        description: "OpenCPN stable release tag, for example Release_5.14.0"
        required: true
        default: "Release_5.14.0"
        type: string

permissions:
  contents: write

concurrency:
  group: opencpn-android-arm64-${{ inputs.opencpn_tag }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      NDK_VERSION: "26.1.10909125"
      BUILD_TOOLS_VERSION: "35.0.0"
      COMPILE_SDK: "35"
      OPENCPN_TAG: ${{ inputs.opencpn_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake gettext git ninja-build unzip zip
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Resolve source versions
        id: versions
        shell: bash
        run: |
          set -euxo pipefail

          if [[ ! "$OPENCPN_TAG" =~ ^Release_([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Only stable OpenCPN tags such as Release_5.14.0 are supported." >&2
            exit 1
          fi
          OPENCPN_VERSION="${BASH_REMATCH[1]}"

          WORK="$RUNNER_TEMP/opencpn-android-build"
          OCPN_SRC="$WORK/OpenCPN"
          ANDROID_SRC="$WORK/OpenCPN-Android"
          COMMON_SRC="$WORK/OCPNAndroidCommon"
          mkdir -p "$WORK"

          git clone --depth 1 --branch "$OPENCPN_TAG" \
            https://github.com/OpenCPN/OpenCPN.git "$OCPN_SRC"

          # Full history is intentional. Select the newest Android packaging
          # commit whose versionName matches the requested OpenCPN release.
          git clone https://github.com/bdbcat/OpenCPN-Android.git "$ANDROID_SRC"
          ANDROID_COMMIT=""
          while read -r sha; do
            if git -C "$ANDROID_SRC" show "$sha:app/build.gradle" 2>/dev/null \
              | grep -Fq "versionName \"$OPENCPN_VERSION\""; then
              ANDROID_COMMIT="$sha"
              break
            fi
          done < <(git -C "$ANDROID_SRC" rev-list --first-parent master)

          if [[ -z "$ANDROID_COMMIT" ]]; then
            echo "No OpenCPN-Android packaging commit found for version $OPENCPN_VERSION." >&2
            exit 1
          fi
          git -C "$ANDROID_SRC" checkout --detach "$ANDROID_COMMIT"

          # Prebuilt Qt Android runtime used by the APK packager.
          git clone --depth 1 https://github.com/bdbcat/OCPNAndroidCommon.git "$COMMON_SRC"

          {
            echo "version=$OPENCPN_VERSION"
            echo "work=$WORK"
            echo "ocpn_src=$OCPN_SRC"
            echo "android_src=$ANDROID_SRC"
            echo "common_src=$COMMON_SRC"
            echo "android_commit=$ANDROID_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Build OpenCPN native library for Android arm64
        shell: bash
        env:
          OCPN_SRC: ${{ steps.versions.outputs.ocpn_src }}
        run: |
          set -euxo pipefail

          TOOL_BASE="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$TOOL_BASE/bin/aarch64-linux-android21-clang++"
          test -x "$TOOL_BASE/bin/llvm-ar"
          test -x "$TOOL_BASE/bin/llvm-ranlib"
          test -x "$TOOL_BASE/bin/llvm-strip"

          # OpenCPN 5.14.0 hard-codes aarch64-linux-android-ar for arm64.
          # That binary does not exist in NDK 26. Patch the toolchain source
          # itself before configure so CMake cannot restore the obsolete tool.
          OCPN_TOOLCHAIN="$OCPN_SRC/buildandroid/build_android.cmake"
          python3 - "$OCPN_TOOLCHAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()
          old = "set(CMAKE_AR ${tool_base}/bin/aarch64-linux-android-ar)"
          new = "set(CMAKE_AR ${tool_base}/bin/llvm-ar)"

          count = text.count(old)
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one obsolete arm64 archiver setting in {path}, found {count}"
              )

          text = text.replace(old, new, 1)
          lines = text.splitlines()

          # Only the arm64 branch matters in this workflow. Add an explicit
          # LLVM ranlib immediately after the arm64 llvm-ar setting.
          arm64_marker = "set(CMAKE_C_COMPILER ${tool_base}/bin/aarch64-linux-android21-clang)"
          try:
              arm64_start = next(i for i, line in enumerate(lines) if line.strip() == arm64_marker)
          except StopIteration:
              raise SystemExit(f"Could not locate arm64 toolchain branch in {path}")

          ar_index = next(
              (i for i in range(arm64_start, len(lines))
               if lines[i].strip() == "set(CMAKE_AR ${tool_base}/bin/llvm-ar)"),
              None,
          )
          if ar_index is None:
              raise SystemExit(f"Could not locate patched arm64 llvm-ar setting in {path}")

          indent = lines[ar_index][:len(lines[ar_index]) - len(lines[ar_index].lstrip())]
          if ar_index + 1 >= len(lines) or "CMAKE_RANLIB" not in lines[ar_index + 1]:
              lines.insert(ar_index + 1, indent + "set(CMAKE_RANLIB ${tool_base}/bin/llvm-ranlib)")

          path.write_text("\n".join(lines) + "\n")
          PY

          grep -nE 'CMAKE_(AR|RANLIB)' "$OCPN_TOOLCHAIN"
          if grep -Fq 'aarch64-linux-android-ar' "$OCPN_TOOLCHAIN"; then
            echo "Obsolete NDK arm64 archiver still present in OpenCPN toolchain." >&2
            exit 1
          fi

          # Avoid OpenCPN's legacy RapidJSON patch path entirely. Supply the
          # exact pristine RapidJSON v1.1.0 tree via its supported RAPIDJSON
          # find_path input instead of letting FetchContent download and patch it.
          RAPIDJSON_COMMIT="f54b0e47a08782a6131cc3d60f94d038fa6e0a51"
          RAPIDJSON_SRC="$RUNNER_TEMP/rapidjson-v1.1.0"
          git clone --depth 1 --branch v1.1.0 \
            https://github.com/Tencent/rapidjson.git "$RAPIDJSON_SRC"
          test "$(git -C "$RAPIDJSON_SRC" rev-parse HEAD)" = "$RAPIDJSON_COMMIT"

          RAPIDJSON_DOC="$RAPIDJSON_SRC/include/rapidjson/document.h"
          test -s "$RAPIDJSON_DOC"
          grep -Fq '#ifndef RAPIDJSON_DOCUMENT_H_' "$RAPIDJSON_DOC"
          grep -Fq '#endif // RAPIDJSON_DOCUMENT_H_' "$RAPIDJSON_DOC"
          grep -Fq 'bool EraseMember(const GenericValue<EncodingType, SourceAllocator>& name) const {' "$RAPIDJSON_DOC"

          BUILD_DIR="$OCPN_SRC/build_android_64_cci_22b"
          cmake -S "$OCPN_SRC" -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DOCPN_TARGET_TUPLE:STRING=Android-arm64;16;arm64" \
            -DOCPN_BUILD_SAMPLE=ON \
            -Dtool_base="$TOOL_BASE" \
            -DRAPIDJSON:PATH="$RAPIDJSON_SRC/include/rapidjson"

          # Guard both workarounds before compiling.
          grep -Fq "${RAPIDJSON_SRC}/include" "$BUILD_DIR/CMakeCache.txt"
          test ! -d "$BUILD_DIR/_deps/rapidjson_src-src"

          if grep -RqsF 'aarch64-linux-android-ar' \
            "$BUILD_DIR/CMakeFiles" \
            "$BUILD_DIR/_deps/lunasvg-build/CMakeFiles"; then
            echo "Generated build rules still reference obsolete aarch64-linux-android-ar." >&2
            grep -RnsF 'aarch64-linux-android-ar' \
              "$BUILD_DIR/CMakeFiles" \
              "$BUILD_DIR/_deps/lunasvg-build/CMakeFiles" || true
            exit 1
          fi

          cmake --build "$BUILD_DIR" --target lunasvg --parallel 2
          cmake --build "$BUILD_DIR" --parallel 2
          test -s "$BUILD_DIR/libgorp.so"

          file "$BUILD_DIR/libgorp.so" | tee /tmp/gorp64.txt
          grep -q 'ELF 64-bit' /tmp/gorp64.txt
          grep -Eq 'ARM aarch64|ARM64|aarch64' /tmp/gorp64.txt


      - name: Prepare arm64-only Android packaging project
        shell: bash
        env:
          OCPN_SRC: ${{ steps.versions.outputs.ocpn_src }}
          ANDROID_SRC: ${{ steps.versions.outputs.android_src }}
          COMMON_SRC: ${{ steps.versions.outputs.common_src }}
        run: |
          set -euxo pipefail

          OCPN_SRC="$OCPN_SRC" ANDROID_SRC="$ANDROID_SRC" COMMON_SRC="$COMMON_SRC" python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["ANDROID_SRC"]) / "app" / "build.gradle"
          text = path.read_text()

          # Replace maintainer-local roots.
          replacements = {
              "Qt_Base": str(Path(os.environ["COMMON_SRC"]) / "qt5"),
              "OCPN_Base": os.environ["OCPN_SRC"],
          }
          for name, value in replacements.items():
              pattern = rf'def\s+{re.escape(name)}\s*=\s*"[^"]*"'
              replacement = f'def {name} = "{value}"'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not patch {name} in {path}")

          # Make shared resources use the arm64 build/runtime. These variables
          # are also referenced by locale and Qt-JAR copy tasks.
          text, count = re.subn(
              r'def\s+Qt_Build\s*=\s*"[^"]*"',
              'def Qt_Build = "build_arm64_O3"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not redirect Qt_Build to arm64")

          text, count = re.subn(
              r'def\s+OCPN_Build\s*=\s*"[^"]*"',
              'def OCPN_Build = "build_android_64_cci_22b"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not redirect OCPN_Build to arm64")

          # Restrict both default and debug Android configurations to arm64-v8a.
          text, count = re.subn(
              r"ndk\.abiFilters\s+['\"]armeabi-v7a['\"]\s*,\s*['\"]arm64-v8a['\"]",
              "ndk.abiFilters 'arm64-v8a'",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not patch defaultConfig ABI filters")

          text, count = re.subn(
              r'^\s*abiFilters\s+["\']armeabi-v7a["\']\s*$',
              '',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not remove debug armeabi-v7a ABI filter")

          # Disable every active preBuild dependency that produces or consumes
          # 32-bit native code. Leave data-only and all 64-bit tasks enabled.
          disable_tasks = {
              "copyWMM_PIFiles",
              "copyDNLDR_PIFiles",
              "copyGRIB_PIFiles",
              "copyDASHBOARD_PIFiles",
              "copyQTLibs_armeabi_v7a",
              "copyOCPN_CORE",
              "copySERVERFiles32",
          }
          for task in sorted(disable_tasks):
              pattern = rf'^(\s*)preBuild\.dependsOn\({re.escape(task)}\)\s*$'
              text, count = re.subn(
                  pattern,
                  rf'\1// arm64-only: preBuild.dependsOn({task})',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"Could not disable active 32-bit task {task}")

          path.write_text(text)
          PY

          # Remove any checked-in/stale 32-bit payload before Gradle sees it.
          rm -rf "$ANDROID_SRC/app/src/main/jniLibs/armeabi-v7a"
          rm -rf "$ANDROID_SRC/app/src/main/assets/files/Qtplugins/armeabi-v7a"
          find "$ANDROID_SRC/app/src/main/assets/files/plugins" -type f -name '*.so32' -delete 2>/dev/null || true

          # The upstream Play Store package enables Firebase Analytics and
          # Crashlytics and expects the maintainer's private google-services.json.
          # This unofficial build has no Firebase project, so remove Firebase
          # completely instead of generating invalid credentials.
          ANDROID_SRC="$ANDROID_SRC" python3 <<'PY_FIREBASE'
          import os
          import re
          from pathlib import Path

          root_gradle = Path(os.environ["ANDROID_SRC"]) / "build.gradle"
          app_gradle = Path(os.environ["ANDROID_SRC"]) / "app" / "build.gradle"

          root = root_gradle.read_text()
          app = app_gradle.read_text()

          # Remove the two Firebase-related plugin declarations from the root
          # project. Keep the Android application plugin untouched.
          for plugin_id in (
              "com.google.firebase.crashlytics",
              "com.google.gms.google-services",
          ):
              pattern = rf"^\s*id ['\"]{re.escape(plugin_id)}['\"] version ['\"][^'\"]+['\"] apply false\s*$"
              root, count = re.subn(pattern, "", root, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Could not remove root Gradle plugin {plugin_id}")

          # Remove the plugins which generate Firebase resources and Crashlytics
          # build metadata from the app module.
          for plugin_id in (
              "com.google.firebase.crashlytics",
              "com.google.gms.google-services",
          ):
              pattern = rf"^\s*id ['\"]{re.escape(plugin_id)}['\"]\s*$"
              app, count = re.subn(pattern, "", app, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Could not remove app Gradle plugin {plugin_id}")

          # Remove Firebase's BoM and every Firebase runtime dependency used by
          # this packaging project. Without these libraries, their manifest
          # ContentProviders cannot be merged into the APK.
          firebase_dependency_patterns = (
              r'^\s*implementation\s*\(\s*platform\(\s*["\']com\.google\.firebase:firebase-bom:[^"\']+["\']\s*\)\s*\)\s*$',
              r'^\s*implementation\s+["\']com\.google\.firebase:firebase-analytics(?::[^"\']+)?["\']\s*$',
              r'^\s*implementation\s+["\']com\.google\.firebase:firebase-crashlytics(?::[^"\']+)?["\']\s*$',
              r'^\s*implementation\s+["\']com\.google\.firebase:firebase-crashlytics-ndk(?::[^"\']+)?["\']\s*$',
          )
          labels = (
              "Firebase BoM",
              "Firebase Analytics",
              "Firebase Crashlytics",
              "Firebase Crashlytics NDK",
          )
          for pattern, label in zip(firebase_dependency_patterns, labels):
              app, count = re.subn(pattern, "", app, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Could not remove {label} dependency")

          # QtActivity has a minimal direct Firebase Analytics integration:
          # one import, one member field and one getInstance() call. Remove these
          # together with the SDK dependencies. There are no analytics event
          # calls, so this does not alter OpenCPN application control flow.
          qt_activity = (
              Path(os.environ["ANDROID_SRC"])
              / "app" / "src" / "main" / "java"
              / "org" / "qtproject" / "qt5" / "android" / "bindings" / "QtActivity.java"
          )
          java = qt_activity.read_text()

          java_patterns = (
              (r'^\s*import\s+com\.google\.firebase\.analytics\.FirebaseAnalytics;\s*$', "FirebaseAnalytics import"),
              (r'^\s*private\s+FirebaseAnalytics\s+mFirebaseAnalytics;\s*$', "FirebaseAnalytics member"),
              (r'^\s*mFirebaseAnalytics\s*=\s*FirebaseAnalytics\.getInstance\(this\);\s*$', "FirebaseAnalytics initialization"),
          )
          for pattern, label in java_patterns:
              java, count = re.subn(pattern, "", java, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Could not remove {label} from {qt_activity}")

          qt_activity.write_text(java)
          root_gradle.write_text(root)
          app_gradle.write_text(app)
          PY_FIREBASE

          rm -f "$ANDROID_SRC/app/google-services.json"

          # -----------------------------------------------------------------
          # Stage the release-matched core OpenCPN locale catalogs explicitly.
          #
          # The upstream Android Gradle task copyLocaleFiles is NO-SOURCE in
          # this arm64-only layout because it historically consumes generated
          # .mo files from the native build directory. OpenCPN's CMake install
          # rules likewise assume those generated .mo files already exist.
          #
          # Do not run the desktop-style CMake install phase here. Instead,
          # compile the exact release tag's core PO files directly into the
          # Android asset layout OpenCPN expects:
          #   locale/<locale>/LC_MESSAGES/opencpn.mo
          # -----------------------------------------------------------------
          ASSET_FILES="$ANDROID_SRC/app/src/main/assets/files"
          mkdir -p "$ASSET_FILES/locale"

          compiled_catalogs=0
          shopt -s nullglob
          for po in "$OCPN_SRC"/po/opencpn_*.po; do
            base="$(basename "$po" .po)"
            locale="${base#opencpn_}"
            [[ -n "$locale" ]] || continue

            dest="$ASSET_FILES/locale/$locale/LC_MESSAGES"
            mkdir -p "$dest"

            # Validate each catalog while compiling it so malformed PO files
            # fail here rather than at runtime.
            msgfmt --check --check-format -o "$dest/opencpn.mo" "$po"
            test -s "$dest/opencpn.mo"

            compiled_catalogs=$((compiled_catalogs + 1))
          done
          shopt -u nullglob

          if (( compiled_catalogs == 0 )); then
            echo "No core OpenCPN PO catalogs were found under $OCPN_SRC/po." >&2
            exit 1
          fi

          echo "Core OpenCPN catalogs compiled from release tag: $compiled_catalogs"

          # Validate the exact core runtime files implicated by early startup.
          # These are all read from androidGetSharedDir() during OpenCPN init.
          required_assets=(
            "$ASSET_FILES/license.txt"
            "$ASSET_FILES/Configs/configs.xml"
            "$ASSET_FILES/styles/qtstylesheet.qss"
            "$ASSET_FILES/s57data/chartsymbols.xml"
            "$ASSET_FILES/gshhs/poly-c-1.dat"
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Required OpenCPN runtime asset missing or empty: $asset" >&2
              exit 1
            fi
          done

          CORE_MO_COUNT="$(find "$ASSET_FILES/locale" -type f -path '*/LC_MESSAGES/opencpn.mo' | wc -l)"
          echo "Core OpenCPN catalogs staged in APK assets: $CORE_MO_COUNT"
          test "$CORE_MO_COUNT" -gt 0
          find "$ASSET_FILES/locale" -type f -path '*/LC_MESSAGES/opencpn.mo' -print | sort | head -100

          # After source and dependency patching, no Firebase reference should
          # remain anywhere in the application Java/Kotlin source or Gradle files.
          if grep -RnsE 'com\.google\.firebase|Firebase(Crashlytics|Analytics|App)' \
            "$ANDROID_SRC/app/src/main/java" "$ANDROID_SRC/app/src/main/kotlin" 2>/dev/null; then
            echo "Firebase API reference remains in application source after patching." >&2
            exit 1
          fi

          ! grep -REn 'com\.google\.firebase|com\.google\.gms\.google-services|firebase-(bom|analytics|crashlytics)' \
            "$ANDROID_SRC/build.gradle" "$ANDROID_SRC/app/build.gradle"

          GRADLE_FILE="$ANDROID_SRC/app/build.gradle"
          grep -Fq "ndk.abiFilters 'arm64-v8a'" "$GRADLE_FILE"
          grep -Fq "def Qt_Build = \"build_arm64_O3\"" "$GRADLE_FILE"
          grep -Fq "def OCPN_Build = \"build_android_64_cci_22b\"" "$GRADLE_FILE"
          ! grep -Eq '^\s*preBuild\.dependsOn\((copyWMM_PIFiles|copyDNLDR_PIFiles|copyGRIB_PIFiles|copyDASHBOARD_PIFiles|copyQTLibs_armeabi_v7a|copyOCPN_CORE|copySERVERFiles32)\)\s*$' "$GRADLE_FILE"

          test -s "$COMMON_SRC/qt5/build_arm64_O3/qtbase/jar/QtAndroid.jar"
          test -s "$COMMON_SRC/qt5/build_arm64_O3/qtbase/lib/libQt5Core.so"
          test -s "$OCPN_SRC/build_android_64_cci_22b/libgorp.so"

      - name: Build installable arm64 APK
        id: apk
        shell: bash
        env:
          ANDROID_SRC: ${{ steps.versions.outputs.android_src }}
          OPENCPN_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euxo pipefail
          cd "$ANDROID_SRC"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "Gradle completed but no debug APK was found." >&2
            exit 1
          fi

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/aapt"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -q "package: name='org.opencpn.opencpn'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='$OPENCPN_VERSION'"

          # Firebase must be completely absent. The previous build crashed in
          # FirebaseInitProvider before OpenCPN's Activity was even created.
          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | \
            grep -q 'com.google.firebase.provider.FirebaseInitProvider'; then
            echo "APK unexpectedly contains FirebaseInitProvider." >&2
            exit 1
          fi
          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q 'com.google.firebase'; then
            echo "APK unexpectedly contains Firebase manifest components." >&2
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep 'com.google.firebase' >&2 || true
            exit 1
          fi

          # Validate the early-startup data tree inside the APK itself rather
          # than trusting Gradle task output.  The previous failing installation
          # had plugin .mo files but no core opencpn.mo.
          ZIPLIST="$RUNNER_TEMP/apk-files.txt"
          unzip -Z1 "$APK" > "$ZIPLIST"

          grep -Fxq 'assets/files/license.txt' "$ZIPLIST"
          grep -Fxq 'assets/files/Configs/configs.xml' "$ZIPLIST"
          grep -Fxq 'assets/files/styles/qtstylesheet.qss' "$ZIPLIST"
          grep -Fxq 'assets/files/s57data/chartsymbols.xml' "$ZIPLIST"
          grep -Fxq 'assets/files/gshhs/poly-c-1.dat' "$ZIPLIST"

          if ! grep -Eq '^assets/files/locale/[^/]+/LC_MESSAGES/opencpn\.mo$' "$ZIPLIST"; then
            echo "APK contains no core OpenCPN opencpn.mo catalog." >&2
            grep '^assets/files/locale/' "$ZIPLIST" >&2 || true
            exit 1
          fi

          echo "Core OpenCPN catalogs packaged in APK:"
          grep -E '^assets/files/locale/[^/]+/LC_MESSAGES/opencpn\.mo$' "$ZIPLIST" | sort

          # Positive arm64 checks.
          grep -Fxq 'lib/arm64-v8a/libgorp.so' "$ZIPLIST"
          grep -Fxq 'lib/arm64-v8a/libQt5Core.so' "$ZIPLIST"

          # Negative checks ensure this really is arm64-only, not merely an APK
          # where the 32-bit core build happened to be skipped.
          if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'; then
            echo "APK unexpectedly contains armeabi-v7a native libraries." >&2
            unzip -l "$APK" | grep 'lib/armeabi-v7a/' >&2 || true
            exit 1
          fi
          if unzip -l "$APK" | grep -qE 'assets/.+\.so32([[:space:]]|$)'; then
            echo "APK unexpectedly contains 32-bit plugin payloads." >&2
            unzip -l "$APK" | grep -E 'assets/.+\.so32([[:space:]]|$)' >&2 || true
            exit 1
          fi

          OUT="$RUNNER_TEMP/OpenCPN-${OPENCPN_VERSION}-Android-arm64-debug.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          OPENCPN_VERSION: ${{ steps.versions.outputs.version }}
          ANDROID_COMMIT: ${{ steps.versions.outputs.android_commit }}
        run: |
          set -euxo pipefail

          RELEASE_TAG="opencpn-android-${OPENCPN_TAG}-arm64"
          TITLE="OpenCPN ${OPENCPN_VERSION} Android arm64"
          NOTES=$(cat <<EOF_NOTES
          Unofficial, debug-signed arm64-only Android build of OpenCPN ${OPENCPN_TAG}. Firebase Analytics and Crashlytics are removed. Core OpenCPN gettext catalogs are compiled directly from the same release tag and packaged into the APK.

          OpenCPN source: https://github.com/OpenCPN/OpenCPN/tree/${OPENCPN_TAG}
          Android packaging: https://github.com/bdbcat/OpenCPN-Android/commit/${ANDROID_COMMIT}
          APK: ${APK_NAME}
          ABI: arm64-v8a only

          This APK is debug-signed by GitHub Actions. It is not signed with the official OpenCPN/Google Play signing key.
          EOF_NOTES
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
